name: Roll Back

on:
  workflow_dispatch:
   inputs:
     rollback_tag:
        description: "Docker image tag to rollback to (default: stable)"
        required: true
        default: stable

       

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollback:
   runs-on: self-hosted
      
   steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@v1
        with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            password: ${{ secrets.SERVER_PASSWORD }}
            script: |
              cd "/home/server/project/AI Model"
              export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
              export TAG="${{ github.event.inputs.rollback_tag }}"

              echo "Rolling back to image: $DOCKER_USERNAME/asituj-ai:$TAG"
              docker compose up -d
              docker image prune -f
