name: deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: code
        run: npm ci

      - name: Type check
        working-directory: code
        run: npm run typecheck

  build:
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/asituj-ai:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up dangling images
        if: always()
        run: |
         docker image prune -af

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd "/home/server/project/AI Model"
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export TAG="${{ needs.build.outputs.tag }}"

            if docker inspect aimodel-server-1 > /dev/null 2>&1; then
              PREVIOUS_TAG=$(docker inspect --format='{{.Config.Image}}' aimodel-server-1)
              docker tag "$PREVIOUS_TAG" "$DOCKER_USERNAME/asituj-ai:stable"
              echo "Tagged previous image as stable: $PREVIOUS_TAG"
            else
              echo "No previous container found — skipping stable tag (first deploy)."
            fi

            echo "Deploying image: $DOCKER_USERNAME/asituj-ai:$TAG"
            docker compose pull
            docker compose up -d
            docker image prune -f
            KEEP_IDS_FILE=$(mktemp)
            for ref in "$DOCKER_USERNAME/asituj-ai:$TAG" "$DOCKER_USERNAME/asituj-ai:stable"; do
              docker image inspect --format '{{.Id}}' "$ref" 2>/dev/null >> "$KEEP_IDS_FILE" || true
            done
            sort -u -o "$KEEP_IDS_FILE" "$KEEP_IDS_FILE"
            
            if [ ! -s "$KEEP_IDS_FILE" ]; then
              echo "WARNING: could not resolve protected image IDs — skipping cleanup."
            else
              docker images --no-trunc --format '{{.ID}}' "$DOCKER_USERNAME/asituj-ai" | sort -u \
                | grep -v -F -f "$KEEP_IDS_FILE" \
                | xargs -r docker rmi -f
            fi
            rm -f "$KEEP_IDS_FILE"
