name: deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: code
        run: npm ci

      - name: Type check
        working-directory: code
        run: npm run typecheck

  build:
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/asituj-ai:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up dangling images
        if: always()
        run: |
         docker image prune -af

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd "/home/server/project/AI Model"
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export TAG="${{ needs.build.outputs.tag }}"

            if docker inspect aimodel-server-1 > /dev/null 2>&1; then
              PREVIOUS_TAG=$(docker inspect --format='{{.Config.Image}}' aimodel-server-1)
              docker tag "$PREVIOUS_TAG" "$DOCKER_USERNAME/asituj-ai:stable"
              echo "Tagged previous image as stable: $PREVIOUS_TAG"
            else
              echo "No previous container found — skipping stable tag (first deploy)."
            fi

            echo "Deploying image: $DOCKER_USERNAME/asituj-ai:$TAG"
            docker compose pull
            docker compose up -d
            docker image prune -f
            PROTECTED_IDS=$(docker images --format "{{.Tag}} {{.ID}}" "$DOCKER_USERNAME/asituj-ai" | awk -v t="$TAG" '$1==t || $1=="stable" {print $2}')

            docker images --format "{{.Tag}} {{.ID}}" "$DOCKER_USERNAME/asituj-ai" | \
              awk -v ids="$PROTECTED_IDS" 'BEGIN{n=split(ids,a," ");for(i=1;i<=n;i++)keep[a[i]]=1} !($2 in keep){print $2}' | \
              sort -u | \
              xargs -r docker rmi -f
